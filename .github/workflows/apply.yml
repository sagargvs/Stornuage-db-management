name: Apply Liquibase Changesets

on:
  push:
    branches: [ main ]
    paths:
      - 'src/main/resources/**'
      - 'pom.xml'
      - '.github/workflows/apply.yml'
  workflow_dispatch:

jobs:
  apply:
    name: Apply to Postgres (EC2)
    runs-on: [self-hosted, stornuage-db]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Render liquibase.properties
        env:
          LB_URL: ${{ secrets.LB_URL }}
          LB_USER: ${{ secrets.LB_USER }}
          LB_PASSWORD: ${{ secrets.LB_PASSWORD }}
        run: |
          : "${LB_URL:?LB_URL secret is not set}"
          : "${LB_USER:?LB_USER secret is not set}"
          : "${LB_PASSWORD:?LB_PASSWORD secret is not set}"
          envsubst '${LB_URL} ${LB_USER} ${LB_PASSWORD}' \
            < liquibase.properties.template \
            > src/main/resources/liquibase.properties
          echo "Rendered properties (password redacted):"
          grep -v '^password=' src/main/resources/liquibase.properties

      - name: liquibase status
        run: mvn -B liquibase:status

      - name: liquibase update
        run: mvn -B liquibase:update
