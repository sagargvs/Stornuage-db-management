name: Apply Liquibase Changesets

on:
  push:
    branches: [ main ]
    paths:
      - 'src/main/resources/**'
      - 'pom.xml'
      - '.github/workflows/apply.yml'
  workflow_dispatch:

jobs:
  apply:
    name: Apply to Postgres (EC2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Render liquibase.properties
        env:
          LB_URL: ${{ secrets.LB_URL }}
          LB_USER: ${{ secrets.LB_USER }}
          LB_PASSWORD: ${{ secrets.LB_PASSWORD }}
        run: |
          sed \
            -e "s|\${LB_URL}|${LB_URL}|g" \
            -e "s|\${LB_USER}|${LB_USER}|g" \
            -e "s|\${LB_PASSWORD}|${LB_PASSWORD}|g" \
            liquibase.properties.template > liquibase.properties

      - name: liquibase status
        run: mvn -B liquibase:status

      - name: liquibase update
        run: mvn -B liquibase:update
